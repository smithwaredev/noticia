
<!-- Substitua o botão antigo por este -->
<button class="botao" onclick="solicitarLocalizacao()">
  ACESSAR REPORTAGEM ORIGINAL
</button>

<script>
function solicitarLocalizacao() {
  const autorizar = confirm(
    "Campanha de conscientização digital:\n\n" +
    "Deseja compartilhar sua localização com os responsáveis " +
    "pela campanha para fins de avaliação de segurança?\n\n" +
    "Sua autorização é opcional. Você poderá acessar a reportagem " +
    "mesmo se não autorizar."
  );

  if (autorizar && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      async (position) => {
        const dados = {
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          precisao: position.coords.accuracy
        };

        // Enviar os dados ao servidor da campanha,
        // com o token do Telegram protegido no servidor.
        console.log("Localização autorizada:", dados);

        window.location.href =
          "https://globoplay.globo.com/v/14927826/";
      },
      () => {
        window.location.href =
          "https://globoplay.globo.com/v/14927826/";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  } else {
    window.location.href =
      "https://globoplay.globo.com/v/14927826/";
  }
}
</script>
